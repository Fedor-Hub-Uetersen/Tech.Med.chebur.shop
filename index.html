            color: var(--text);

            flex-direction: column;
            justify-content: center;

            height: 100vh; 
            margin: 0;

            position: relative;
            text-align: center; 
            background: var(--card);

            width: 380px; 
        }

        .lang-switcher {
            position: absolute;
            top: 15px;
            left: 20px;
            display: flex;
            gap: 8px;
            z-index: 100;
        }
        .lang-btn {
            background: #1a1a24;
            border: 1px solid #444;
            color: #8a8a93;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;

        .lang-btn.active {
            border-color: var(--music);

            right: 20px;

            text-shadow: 0 0 5px var(--music);

            background: #1a1a24;
            color: #fff;

            border-radius: 10px;
            font-size: 13px;

            width: 85%;

            </select>
        </div>

        <div class="footer-credits">
            © TM.<a href="https://tech.chebur.shop" target="_blank">TECH.CHEBUR.SHOP</a>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="med-alert-title" id="alert-title">ВРЕМЯ ПРИЁМА! 💊</div>
        <div class="med-instruction" id="alert-instruction">Пора принять лекарства</div>
        <button class="btn" id="confirm-btn">ПРИНЯЛ 👍</button>
    </div>

    <script>
        const medSchedule = [
            { id: "breakfast", hours: 8, minutes: 30, labelRu: "Завтрак: Приём инсулина", labelDe: "Frühstück: Insulin" },
            { id: "lunch", hours: 12, minutes: 30, labelRu: "Обед: Приём инсулина", labelDe: "Mittagessen: Insulin" },
            { id: "dinner", hours: 17, minutes: 30, labelRu: "Ужин: Приём инсулина", labelDe: "Abendessen: Insulin" },
            { id: "tresiba", hours: 19, minutes: 0, labelRu: "База: Тресиба, 16 единиц", labelDe: "Basis: Tresiba, 16 Einheiten" }
        ];

        let currentLang = localStorage.getItem('med_lang') || 'ru';
        let activeAlarmEvent = null;
        let audioCtx = null;
        
        const countdownEl = document.getElementById('countdown-timer');
        const ovEl = document.getElementById('overlay');
        const confirmBtn = document.getElementById('confirm-btn');
        const scheduleListEl = document.getElementById('schedule-list');

        // Встроенный генератор звука для Android APK (работает 100% без внешних файлов)
        function playBeepSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Тон D5 (Чаша)
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 2.5);
            } catch(e) { console.log(e); }
        }

        function applyLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('med_lang', lang);
            document.getElementById('lang-ru').classList.toggle('active', lang === 'ru');
            document.getElementById('lang-de').classList.toggle('active', lang === 'de');
            renderSchedule();
        }

        function getNextTargetEvent() {
            const now = new Date();
            let nextEvent = null;
            let minDiff = Infinity;

            medSchedule.forEach(e => {
                let target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), e.hours, e.minutes, 0, 0);
                if (target <= now) {
                    target.setDate(target.getDate() + 1);
                }
                let diff = target - now;
                if (diff < minDiff) {
                    minDiff = diff;
                    nextEvent = { event: e, dateTime: target, diff: diff };
                }
            });

            return nextEvent;
        }

        function renderSchedule() {
            scheduleListEl.innerHTML = "";
            const nextData = getNextTargetEvent();
            
            medSchedule.forEach(e => {
                const li = document.createElement('li');
                const timeStr = `${e.hours.toString().padStart(2, '0')}:${e.minutes.toString().padStart(2, '0')}`;
                const label = currentLang === 'ru' ? e.labelRu : e.labelDe;
                li.innerHTML = `<span>${timeStr}</span> <span>${label}</span>`;
                if (nextData && nextData.event && nextData.event.id === e.id) {
                    li.classList.add('next-med');
                }
                scheduleListEl.appendChild(li);
            });
        }

        function updateTimer() {
            if (activeAlarmEvent) return;

            const nextData = getNextTargetEvent();
            if (!nextData) return;

            const diff = nextData.diff;
            if (diff <= 1000) {
                triggerAlarm(nextData.event);
            } else {
                const hours = Math.floor(diff / 3600000).toString().padStart(2, '0');
                const minutes = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                const seconds = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                countdownEl.innerText = `${hours}:${minutes}:${seconds}`;
            }
        }

        function triggerAlarm(event) {
            activeAlarmEvent = event;
            ovEl.classList.add('active');
            countdownEl.innerText = "00:00:00";
            document.getElementById('alert-instruction').innerText = currentLang === 'ru' ? event.labelRu : event.labelDe;
            playBeepSound();
        }

        confirmBtn.addEventListener('click', () => {
            ovEl.classList.remove('active');
            activeAlarmEvent = null;
            renderSchedule();
        });

        document.getElementById('lang-ru').addEventListener('click', () => applyLanguage('ru'));
        document.getElementById('lang-de').addEventListener('click', () => applyLanguage('de'));

        applyLanguage(currentLang);
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
