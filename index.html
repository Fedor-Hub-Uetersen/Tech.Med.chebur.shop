<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home.chebur.shop — Дом и Кухня</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Home & Kitchen">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="wolf.png">
    <link rel="icon" type="image/png" href="wolf.png">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root { 
            --bg: #0a0a0c; 
            --card: #121216; 
            --text: #ffffff; 
            --accent: #ff5500; 
            --home-color: #00ffff; 
            --music: #00ff66;  
            --neon-glow: 0 0 15px var(--accent), 0 0 30px var(--accent);
            --neon-home: 0 0 15px var(--home-color), 0 0 25px var(--home-color);
            --neon-footer: 0 0 6px var(--accent);
        }
        
        html, body {
            width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 12px;
        }

        .container { 
            position: relative; 
            text-align: center; 
            background: var(--card); 
            padding: 25px 18px; 
            border-radius: 20px; 
            border: 2px solid var(--accent); 
            box-shadow: 0 0 25px rgba(255, 85, 0, 0.2), inset 0 0 15px rgba(255, 85, 0, 0.1); 
            width: 100%;
            max-width: 400px; 
            margin: 10px auto; 
        }

        .lang-switcher {
            position: absolute;
            top: 15px;
            left: 16px;
            display: flex;
            gap: 5px;
        }
        .lang-btn {
            background: #1a1a24; border: 1px solid #444; color: #8a8a93;
            padding: 3px 7px; font-size: 11px; border-radius: 5px;
            cursor: pointer; font-weight: bold; transition: all 0.3s;
        }
        .lang-btn.active {
            border-color: var(--home-color); color: #fff; box-shadow: 0 0 5px var(--home-color);
        }

        .streak-counter {
            position: absolute;
            top: 17px; right: 16px; font-size: 11px; font-weight: bold;
            color: var(--music); text-shadow: 0 0 5px var(--music);
            letter-spacing: 1px; text-transform: uppercase;
        }

        .logo-area { 
            margin-top: 34px;
            margin-bottom: 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            width: 100%;
        }
        .wolf-logo-placeholder {
            max-width: 100%;
            font-size: clamp(12px, 3.8vw, 16px); 
            font-weight: bold; 
            letter-spacing: 1.5px; 
            color: #fff; 
            text-shadow: var(--neon-glow); 
            border: 1px dashed rgba(255, 85, 0, 0.4); 
            padding: 8px 12px; 
            border-radius: 10px; 
            text-transform: uppercase;
            word-break: break-word;
        }

        h1 { 
            font-size: clamp(17px, 5vw, 20px); 
            color: #fff; 
            text-shadow: var(--neon-glow); 
            margin: 12px 0 5px 0; 
            text-transform: uppercase; 
        }
        .timer { 
            font-size: clamp(32px, 10vw, 42px); 
            font-weight: bold; 
            margin: 5px 0; 
            font-variant-numeric: tabular-nums; 
            text-shadow: 0 0 10px #fff; 
            color: var(--home-color); 
        }
        .status { font-size: 12px; color: #8a8a93; letter-spacing: 1px; text-transform: uppercase; }
        
        .hearth-video-container {
            margin: 15px 0; width: 100%; border-radius: 12px; border: 2px solid var(--accent);
            box-shadow: 0 0 10px rgba(255, 85, 0, 0.3); overflow: hidden; background: #000; aspect-ratio: 16 / 9;
        }
        .hearth-video-container video { width: 100%; height: 100%; object-fit: cover; display: block; }

        .home-schedule { margin: 15px 0; padding: 0; list-style: none; text-align: left; font-size: 13px; color: #bbb; max-height: 160px; overflow-y: auto; }
        .home-schedule li { padding: 6px 0; border-bottom: 1px solid #1a1a24; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
        .home-schedule li.next-task { color: var(--home-color); font-weight: bold; }

        .schedule-editor { margin: 15px 0; display: flex; gap: 6px; flex-direction: column; width: 100%; }
        .schedule-editor input {
            width: 100%;
            background: #1a1a24; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 8px; outline: none; font-size: 13px;
        }
        .schedule-editor button {
            width: 100%;
            background: var(--accent); color: #fff; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; text-transform: uppercase; transition: opacity 0.2s;
        }
        .schedule-editor button:hover { opacity: 0.9; }

        .sound-selector { margin: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 5px; width: 100%; }
        .sound-selector label { font-size: 11px; color: #8a8a93; text-transform: uppercase; }
        .sound-selector select {
            width: 100%;
            max-width: 240px;
            background: #1a1a24; color: #fff; border: 1px solid var(--accent);
            padding: 7px 12px; border-radius: 10px; font-size: 13px; cursor: pointer; outline: none;
        }

        .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(6, 6, 8, 0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2147483647; opacity: 0; pointer-events: none; transition: opacity 0.5s; }
        .overlay.active { opacity: 1; pointer-events: auto; }
        .content { text-align: center; max-width: 500px; width: 100%; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .home-alert-title { font-size: clamp(24px, 7vw, 32px); color: #fff; text-shadow: var(--neon-home); margin-bottom: 10px; text-transform: uppercase; }
        .home-instruction { font-size: clamp(16px, 5vw, 20px); color: #ffaa66; margin-bottom: 25px; font-weight: bold; }
        
        .btn { background: transparent; color: #fff; border: 2px solid var(--home-color); padding: 15px 35px; font-size: 16px; border-radius: 25px; cursor: pointer; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; transition: all 0.2s; box-shadow: inset 0 0 8px rgba(0, 255, 255, 0.2); }
        .btn:hover { background: var(--home-color); box-shadow: var(--neon-home); color: #000; transform: scale(1.05); }

        .footer-credits { margin-top: 25px; font-size: 11px; color: #bbb; letter-spacing: 1px; text-transform: uppercase; }
        .footer-credits a { color: var(--accent); text-decoration: none; font-weight: bold; text-shadow: var(--neon-footer); }
    </style>
</head>
<body>

    <div class="container">
        <div class="lang-switcher">
            <button class="lang-btn active" id="lang-en">EN</button>
            <button class="lang-btn" id="lang-ru">RU</button>
            <button class="lang-btn" id="lang-de">DE</button>
        </div>

        <div class="streak-counter" id="streak-display">Home-Score: 0</div>

        <div class="logo-area">
            <div class="wolf-logo-placeholder">Home.chebur.shop</div>
        </div>

        <h1 id="main-title">Home & Kitchen</h1>
        <div class="status" id="status-text">Next task in:</div>
        <div class="timer" id="countdown-timer">00:00:00</div>
        
        <!-- HOME HEARTH VIDEO PLAYER -->
        <div class="hearth-video-container">
            <video id="hearth-player" autoplay loop playsinline controls preload="auto">
                <source src="hearth.mp4" type="video/mp4">
                <source src="promo.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <ul class="home-schedule" id="schedule-list"></ul>

        <!-- USER SCHEDULE EDITOR FORM -->
        <div class="schedule-editor">
            <input type="time" id="new-task-time">
            <input type="text" id="new-task-label" placeholder="Task / Kitchen step">
            <button id="add-task-btn">Add Task ➕</button>
        </div>

        <div class="sound-selector">
            <label for="alarm-sound-select" id="sound-label">🔔 Alert Sound:</label>
            <select id="alarm-sound-select">
                <option value="gong.mp3" id="opt-gong" selected>Cosmic Gong</option>
                <option value="digital.mp3" id="opt-dig">Digital Signal</option>
                <option value="bowl.mp3" id="opt-bowl">Tibetan Bowl</option>
            </select>
        </div>

        <div class="footer-credits">
            © Tm.<a href="https://tech.chebur.shop" target="_blank">tech.chebur.shop</a>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="content">
            <div class="home-alert-title" id="alert-title">Task Time! 🏡</div>
            <div class="home-instruction" id="alert-instruction">Time for your scheduled home or kitchen task</div>
            <button class="btn" id="confirm-btn">Done 👍</button>
        </div>
    </div>

    <audio id="alarm-sound" preload="auto" loop></audio>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error', err));
        }

        // Load schedule from local storage or use default home/kitchen tasks
        let homeSchedule = JSON.parse(localStorage.getItem('user_home_schedule')) || [
            { id: "air_room", time: "08:30", labelEn: "Air the kitchen & room", labelRu: "Проветрить кухню и комнату", labelDe: "Küche und Zimmer lüften" },
            { id: "prep_cook", time: "12:30", labelEn: "Check stove / kitchen prep", labelRu: "Проверить плиту / заготовки на кухне", labelDe: "Herd prüfen / Küchenvorbereitung" },
            { id: "water_plants", time: "16:00", labelEn: "Water indoor plants", labelRu: "Полить комнатные растения", labelDe: "Zimmerpflanzen gießen" },
            { id: "evening_tidy", time: "19:00", labelEn: "Tidy kitchen & counter", labelRu: "Убрать на кухне и протереть стол", labelDe: "Küche aufräumen und Tisch abwischen" }
        ];

        const i18n = {
            en: {
                mainTitle: "Home & Kitchen",
                statusText: "Next task in:",
                inputPlaceholder: "Task / Kitchen step",
                addBtn: "Add Task ➕",
                removeTitle: "Remove",
                validationAlert: "Please enter both time and task name!",
                soundLabel: "🔔 Alert Sound:",
                optDig: "Digital Signal",
                optGong: "Cosmic Gong",
                optBowl: "Tibetan Bowl",
                alertTitle: "Task Time! 🏡",
                alertDefault: "Time for your scheduled home or kitchen task",
                btnConfirm: "Done 👍",
                notifTitle: "Home & Kitchen",
                notifBody: "Time for your home or kitchen task!"
            },
            ru: {
                mainTitle: "Дом и Кухня",
                statusText: "Следующее дело через:",
                inputPlaceholder: "Задача / Дело на кухне",
                addBtn: "Добавить дело ➕",
                removeTitle: "Удалить",
                validationAlert: "Укажите время и название дела!",
                soundLabel: "🔔 Сигнал оповещения:",
                optDig: "Цифровой сигнал",
                optGong: "Космический гонг",
                optBowl: "Тибетская чаша",
                alertTitle: "Время дела! 🏡",
                alertDefault: "Пора выполнить запланированное дело по дому или кухне",
                btnConfirm: "Готово 👍",
                notifTitle: "Дом и Кухня",
                notifBody: "Пора за дело по дому или на кухне!"
            },
            de: {
                mainTitle: "Haus & Küche",
                statusText: "Nächste Aufgabe in:",
                inputPlaceholder: "Aufgabe / Küchenschritt",
                addBtn: "Aufgabe hinzufügen ➕",
                removeTitle: "Entfernen",
                validationAlert: "Bitte Uhrzeit und Aufgabe angeben!",
                soundLabel: "🔔 Alarmsignal:",
                optDig: "Digitaler Alarm",
                optGong: "Weltraum-Gong",
                optBowl: "Tibetische Schale",
                alertTitle: "Aufgabenzeit! 🏡",
                alertDefault: "Zeit für Ihre geplante Aufgabe in Haus oder Küche",
                btnConfirm: "Erledigt 👍",
                notifTitle: "Haus & Küche",
                notifBody: "Zeit für Ihre Aufgabe in Haus oder Küche!"
            }
        };

        let currentLang = localStorage.getItem('home_lang') || 'en';
        let timerInterval = null;
        let activeAlarmEvent = null;
        let reminderRepeatInterval = null;
        
        const countdownEl = document.getElementById('countdown-timer');
        const ovEl = document.getElementById('overlay');
        const alarmAudio = document.getElementById('alarm-sound');
        const confirmBtn = document.getElementById('confirm-btn');
        const streakEl = document.getElementById('streak-display');
        const soundSelect = document.getElementById('alarm-sound-select');
        const scheduleListEl = document.getElementById('schedule-list');

        if (Notification.permission !== "granted" && Notification.permission !== "denied") {
            Notification.requestPermission();
        }

        function saveSchedule() {
            localStorage.setItem('user_home_schedule', JSON.stringify(homeSchedule));
        }

        function getLocalizedLabel(event) {
            if (currentLang === 'en') return event.labelEn || event.labelRu || event.label;
            if (currentLang === 'de') return event.labelDe || event.labelEn || event.labelRu || event.label;
            return event.labelRu || event.labelEn || event.label;
        }

        function applyLanguage(lang) {
            if (!i18n[lang]) lang = 'en';
            currentLang = lang;
            localStorage.setItem('home_lang', lang);
            document.documentElement.lang = lang;

            document.getElementById('lang-en').classList.toggle('active', lang === 'en');
            document.getElementById('lang-ru').classList.toggle('active', lang === 'ru');
            document.getElementById('lang-de').classList.toggle('active', lang === 'de');

            document.getElementById('main-title').innerText = i18n[lang].mainTitle;
            document.getElementById('status-text').innerText = i18n[lang].statusText;
            document.getElementById('new-task-label').placeholder = i18n[lang].inputPlaceholder;
            document.getElementById('add-task-btn').innerText = i18n[lang].addBtn;
            document.getElementById('sound-label').innerText = i18n[lang].soundLabel;
            document.getElementById('opt-dig').innerText = i18n[lang].optDig;
            document.getElementById('opt-gong').innerText = i18n[lang].optGong;
            document.getElementById('opt-bowl').innerText = i18n[lang].optBowl;
            document.getElementById('alert-title').innerText = i18n[lang].alertTitle;
            document.getElementById('alert-instruction').innerText = i18n[lang].alertDefault;
            confirmBtn.innerText = i18n[lang].btnConfirm;

            updateStreakDisplay();
            renderSchedule();
        }

        function renderSchedule() {
            scheduleListEl.innerHTML = "";
            const nextTarget = getNextTargetEvent();
            const nextEvent = nextTarget ? nextTarget.event : null;
            
            homeSchedule.forEach((event, index) => {
                const li = document.createElement('li');
                const label = getLocalizedLabel(event);
                li.innerHTML = `<span>${event.time}</span> <span style="flex-grow: 1; margin: 0 8px; text-align: left; word-break: break-word;">${label}</span> <button onclick="removeTask(${index})" style="background: none; border: none; color: #ff5500; cursor: pointer; font-size: 14px; flex-shrink: 0;" title="${i18n[currentLang].removeTitle}">❌</button>`;
                
                if (nextEvent && nextEvent.id === event.id) {
                    li.classList.add('next-task');
                }
                scheduleListEl.appendChild(li);
            });
        }

        window.removeTask = function(index) {
            homeSchedule.splice(index, 1);
            saveSchedule();
            renderSchedule();
        }

        document.getElementById('add-task-btn').addEventListener('click', () => {
            const timeVal = document.getElementById('new-task-time').value;
            const labelVal = document.getElementById('new-task-label').value.trim();

            if (!timeVal || !labelVal) {
                alert(i18n[currentLang].validationAlert);
                return;
            }

            const newEvent = {
                id: "task_" + Date.now(),
                time: timeVal,
                labelEn: labelVal,
                labelRu: labelVal,
                labelDe: labelVal
            };

            homeSchedule.push(newEvent);
            homeSchedule.sort((a, b) => a.time.localeCompare(b.time));
            saveSchedule();
            renderSchedule();

            document.getElementById('new-task-time').value = "";
            document.getElementById('new-task-label').value = "";
        });

        function getNextTargetEvent() {
            if (homeSchedule.length === 0) return null;
            const now = new Date();
            let list = homeSchedule.map(e => {
                const [h, m] = e.time.split(':');
                const d = new Date();
                d.setHours(parseInt(h), parseInt(m), 0, 0);
                
                const lastConfirmed = localStorage.getItem(`conf_${e.id}`);
                const todayStr = now.toDateString();
                
                let targetDate = new Date(d);
                if (lastConfirmed === todayStr || d < now) {
                    targetDate.setDate(targetDate.getDate() + 1);
                }
                
                return { event: e, dateTime: targetDate, isMissed: (d <= now && lastConfirmed !== todayStr) };
            });

            const missed = list.filter(l => l.isMissed);
            if (missed.length > 0) {
                missed.sort((a, b) => b.dateTime - a.dateTime);
                return { event: missed[0].event, dateTime: missed[0].dateTime, triggerNow: true };
            }

            list.sort((a, b) => a.dateTime - b.dateTime);
            return list[0];
        }

        function updateTimer() {
            if (activeAlarmEvent || homeSchedule.length === 0) return;

            const now = new Date();
            const target = getNextTargetEvent();
            
            if (!target || !target.event) return;

            if (target.triggerNow || target.dateTime - now <= 0) {
                triggerAlarm(target.event);
            } else {
                const diff = target.dateTime - now;
                const hours = Math.floor(diff / 3600000).toString().padStart(2, '0');
                const minutes = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                const seconds = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                countdownEl.innerText = `${hours}:${minutes}:${seconds}`;
            }
        }

        function triggerAlarm(event) {
            activeAlarmEvent = event;
            ovEl.classList.add('active');
            countdownEl.innerText = "00:00:00";
            
            const eventLabel = getLocalizedLabel(event);
            document.getElementById('alert-instruction').innerText = eventLabel;
            
            // Play alert audio and repeat voice announcement with queue reset
            const playAlertSequence = () => {
                alarmAudio.src = soundSelect.value;
                alarmAudio.play().catch(e => console.log("Waiting for user interaction to play audio"));

                let speechText = `Attention! Task time: ${eventLabel}. Scheduled for ${event.time}`;
                let speechLang = 'en-US';

                if (currentLang === 'ru') {
                    speechText = `Внимание! Пора выполнить: ${eventLabel}. Запланировано на ${event.time}`;
                    speechLang = 'ru-RU';
                } else if (currentLang === 'de') {
                    speechText = `Achtung! Aufgabenzeit: ${eventLabel}. Geplant um ${event.time}`;
                    speechLang = 'de-DE';
                }
                
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(speechText);
                    utterance.lang = speechLang;
                    utterance.rate = 0.95;
                    utterance.pitch = 1.0;
                    window.speechSynthesis.speak(utterance);
                }
            };

            // Trigger immediately on first call
            playAlertSequence();

            // Repeat every 30 seconds (30000 ms) with speech queue reset
            if (!reminderRepeatInterval) {
                reminderRepeatInterval = setInterval(() => {
                    if (activeAlarmEvent) {
                        playAlertSequence();
                    } else {
                        clearInterval(reminderRepeatInterval);
                        reminderRepeatInterval = null;
                    }
                }, 30000);
            }

            if (Notification.permission === "granted") {
                new Notification(i18n[currentLang].notifTitle, { 
                    body: eventLabel,
                    tag: "home-alarm",
                    requireInteraction: true 
                });
            }
        }

        function getScoreValue() {
            const saved = localStorage.getItem('home_score');
            if (saved !== null) return parseInt(saved) || 0;
            const legacy = parseInt(localStorage.getItem('med_streak')) || 0;
            localStorage.setItem('home_score', legacy);
            return legacy;
        }

        function updateStreakDisplay() {
            const currentScore = getScoreValue();
            streakEl.innerText = `Home-Score: ${currentScore}`;
        }

        confirmBtn.addEventListener('click', () => {
            if (activeAlarmEvent) {
                const todayStr = new Date().toDateString();
                localStorage.setItem(`conf_${activeAlarmEvent.id}`, todayStr);
            }

            ovEl.classList.remove('active');
            alarmAudio.pause();
            alarmAudio.currentTime = 0;
            
            // Stop voice synthesis and clear repeat interval
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }

            if (reminderRepeatInterval) {
                clearInterval(reminderRepeatInterval);
                reminderRepeatInterval = null;
            }

            activeAlarmEvent = null;

            let currentScore = getScoreValue();
            currentScore++;
            localStorage.setItem('home_score', currentScore);
            updateStreakDisplay();
            renderSchedule();
        });

        document.getElementById('lang-en').addEventListener('click', () => applyLanguage('en'));
        document.getElementById('lang-ru').addEventListener('click', () => applyLanguage('ru'));
        document.getElementById('lang-de').addEventListener('click', () => applyLanguage('de'));
        
        soundSelect.addEventListener('change', () => {
            alarmAudio.src = soundSelect.value;
            alarmAudio.play().catch(e => console.log("Audio preview"));
            setTimeout(() => { alarmAudio.pause(); alarmAudio.currentTime = 0; }, 1500);
        });

        window.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('hearth-player');
            if (video) {
                video.muted = false;
                video.play().catch(() => {
                    video.muted = true;
                    video.play();
                    document.addEventListener('click', () => {
                        video.muted = false;
                        video.play();
                    }, { once: true });
                });
            }
        });

        applyLanguage(currentLang);
        timerInterval = setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
