<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech.Med.chebur.shop</title>
    <style>
        :root { 
            --bg: #0a0a0c; 
            --card: #121216; 
            --text: #ffffff; 
            --accent: #ff5500; 
            --med-color: #00ffff; 
            --music: #00ff66;
        }
        
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 10px;
        }

        .container { 
            position: relative;
            text-align: center; 
            background: var(--card); 
            padding: 20px; 
            border-radius: 20px; 
            border: 2px solid var(--accent);
            box-shadow: 0 0 25px rgba(255, 85, 0, 0.2); 
            width: 90%;
            max-width: 360px; 
        }

        .lang-switcher {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 5px;
        }
        .lang-btn {
            background: #1a1a24; border: 1px solid #444; color: #8a8a93;
            padding: 3px 8px; font-size: 11px; border-radius: 5px;
            cursor: pointer; font-weight: bold;
        }
        .lang-btn.active {
            border-color: var(--med-color); color: #fff; background: #008899;
        }

        .streak-counter {
            position: absolute;
            top: 15px; right: 15px; font-size: 11px; font-weight: bold;
            color: var(--music); text-transform: uppercase;
        }

        .logo-title {
            font-size: 14px; font-weight: bold; color: #fff;
            border: 1px dashed rgba(255, 85, 0, 0.4);
            padding: 5px 10px; border-radius: 8px; margin-top: 25px;
            display: inline-block;
        }

        h1 { font-size: 18px; color: #fff; margin: 15px 0 5px 0; text-transform: uppercase; }
        .status { font-size: 11px; color: #8a8a93; text-transform: uppercase; }
        .timer { font-size: 44px; font-weight: bold; margin: 5px 0; color: var(--med-color); text-shadow: 0 0 10px var(--med-color); }
        
        .promo-container {
            margin: 10px 0; width: 100%; border-radius: 12px; border: 2px solid var(--accent);
            overflow: hidden; background: #000; aspect-ratio: 16 / 9;
        }
        .promo-container video { width: 100%; height: 100%; object-fit: cover; }

        .med-schedule { margin: 15px 0; padding: 0; list-style: none; text-align: left; font-size: 12px; color: #bbb; }
        .med-schedule li { padding: 6px 0; border-bottom: 1px solid #1a1a24; display: flex; justify-content: space-between; }
        .med-schedule li.next-med { color: var(--med-color); font-weight: bold; }

        .sound-selector { margin: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .sound-selector label { font-size: 10px; color: #8a8a93; text-transform: uppercase; }
        .sound-selector select {
            background: #1a1a24; color: #fff; border: 1px solid var(--accent);
            padding: 5px 10px; border-radius: 8px; font-size: 12px;
        }

        .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(6, 6, 8, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .overlay.active { opacity: 1; pointer-events: auto; }
        .med-alert-title { font-size: 28px; color: #fff; margin-bottom: 10px; }
        .med-instruction { font-size: 18px; color: #ffaa66; margin-bottom: 20px; font-weight: bold; }
        .btn { background: transparent; color: #fff; border: 2px solid var(--med-color); padding: 12px 30px; font-size: 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }

        .footer-credits { margin-top: 15px; font-size: 10px; color: #8a8a93; }
        .footer-credits a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="lang-switcher">
            <button class="lang-btn active" id="lang-ru">РУ</button>
            <button class="lang-btn" id="lang-de">ДЕ</button>
        </div>

        <div class="streak-counter" id="streak-display">БИОЛОГИЧЕСКИЙ РЕЙТИНГ: 0</div>

        <div class="logo-title">TECH.MED.CHEBUR.SHOP</div>

        <h1 id="main-title">МОНИТОР ЗДОРОВЬЯ</h1>
        <div class="status" id="status-text">СЛЕДУЮЩИЙ ПРИЁМ ЧЕРЕЗ:</div>
        <div class="timer" id="countdown-timer">00:00:00</div>
        
        <div class="promo-container">
            <video id="promo-player" autoplay loop muted playsinline controls preload="auto">
                <source src="promo.mp4" type="video/mp4">
            </video>
        </div>

        <ul class="med-schedule" id="schedule-list"></ul>

        <div class="sound-selector">
            <label for="alarm-sound-select" id="sound-label">🔔 СИГНАЛ ТРЕВОГИ:</label>
            <select id="alarm-sound-select">
                <option value="beep" selected>Электронный сигнал</option>
            </select>
        </div>

        <div class="footer-credits">
            © TM.<a href="https://tech.chebur.shop" target="_blank">TECH.CHEBUR.SHOP</a>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="med-alert-title" id="alert-title">ВРЕМЯ ПРИЁМА! 💊</div>
        <div class="med-instruction" id="alert-instruction">Пора принять лекарства</div>
        <button class="btn" id="confirm-btn">ПРИНЯЛ 👍</button>
    </div>

    <script>
        const medSchedule = [
            { id: "breakfast", time: "08:30", labelRu: "Завтрак: Приём инсулина", labelDe: "Frühstück: Insulin" },
            { id: "lunch", time: "12:30", labelRu: "Обед: Приём инсулина", labelDe: "Mittagessen: Insulin" },
            { id: "dinner", time: "17:30", labelRu: "Ужин: Приём инсулина", labelDe: "Abendessen: Insulin" },
            { id: "tresiba", time: "19:00", labelRu: "База: Тресиба, 16 единиц", labelDe: "Basis: Tresiba, 16 Einheiten" }
        ];

        let currentLang = localStorage.getItem('med_lang') || 'ru';
        let activeAlarmEvent = null;
        let audioCtx = null;
        let alarmTimer = null;
        
        const countdownEl = document.getElementById('countdown-timer');
        const ovEl = document.getElementById('overlay');
        const confirmBtn = document.getElementById('confirm-btn');
        const scheduleListEl = document.getElementById('schedule-list');

        function playSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } catch(e) {}
        }

        function startBeeping() {
            playSound();
            alarmTimer = setInterval(playSound, 1000);
        }

        function stopBeeping() {
            if (alarmTimer) {
                clearInterval(alarmTimer);
                alarmTimer = null;
            }
        }

        document.addEventListener('click', () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });

        function applyLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('med_lang', lang);
            document.getElementById('lang-ru').classList.toggle('active', lang === 'ru');
            document.getElementById('lang-de').classList.toggle('active', lang === 'de');
            renderSchedule();
        }

        function getNextTargetEvent() {
            const now = new Date();
            let list = medSchedule.map(e => {
                const parts = e.time.split(':');
                const d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(parts[0]), parseInt(parts[1]), 0, 0);
                
                let targetDate = new Date(d);
                if (d <= now) {
                    targetDate.setDate(targetDate.getDate() + 1);
                }
                
                return { event: e, dateTime: targetDate };
            });

            list.sort((a, b) => a.dateTime - b.dateTime);
            return list[0];
        }

        function renderSchedule() {
            scheduleListEl.innerHTML = "";
            const nextData = getNextTargetEvent();
            
            medSchedule.forEach(event => {
                const li = document.createElement('li');
                const label = currentLang === 'ru' ? event.labelRu : event.labelDe;
                li.innerHTML = `<span>${event.time}</span> <span>${label}</span>`;
                if (nextData && nextData.event && nextData.event.id === event.id) {
                    li.classList.add('next-med');
                }
                scheduleListEl.appendChild(li);
            });
        }

        function updateTimer() {
            if (activeAlarmEvent) return;

            const now = new Date();
            const target = getNextTargetEvent();
            
            if (!target || !target.dateTime) return;

            const diff = target.dateTime - now;
            
            if (diff <= 1000) {
                triggerAlarm(target.event);
            } else {
                const hours = Math.floor(diff / 3600000).toString().padStart(2, '0');
                const minutes = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                const seconds = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                countdownEl.innerText = `${hours}:${minutes}:${seconds}`;
            }
        }

        function triggerAlarm(event) {
            activeAlarmEvent = event;
            ovEl.classList.add('active');
            countdownEl.innerText = "00:00:00";
            document.getElementById('alert-instruction').innerText = currentLang === 'ru' ? event.labelRu : event.labelDe;
            startBeeping();
        }

        confirmBtn.addEventListener('click', () => {
            ovEl.classList.remove('active');
            stopBeeping();
            activeAlarmEvent = null;
            renderSchedule();
        });

        document.getElementById('lang-ru').addEventListener('click', () => applyLanguage('ru'));
        document.getElementById('lang-de').addEventListener('click', () => applyLanguage('de'));

        applyLanguage(currentLang);
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
