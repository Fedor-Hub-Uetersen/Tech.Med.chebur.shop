name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Set up Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Build Cordova Project
      run: |
        cordova platform add android || true
        cordova build android --release

    - name: Generate Keystore and Sign APK
      run: |
        APK_DIR="platforms/android/app/build/outputs/apk/release"
        if [ -d "$APK_DIR" ]; then
          cd $APK_DIR
          keytool -genkey -v -keystore fedor.keystore -alias fedorkey -keyalg RSA -keysize 2048 -validity 10000 -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -keypass "${{ secrets.KEYSTORE_PASSWORD }}" -dname "CN=Fedor, OU=Health, O=CheburShop, L=Uetersen, C=DE"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore fedor.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" app-release-unsigned.apk fedorkey
          $ANDROID_HOME/build-tools/33.0.2/zipalign -v 4 app-release-unsigned.apk fedor-health-monitor.apk
        else
          echo "APK directory not found!"
          exit 1
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release APK #${{ github.run_number }}
        files: platforms/android/app/build/outputs/apk/release/fedor-health-monitor.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
