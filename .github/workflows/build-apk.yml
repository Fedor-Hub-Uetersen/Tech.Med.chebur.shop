name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build APK with Cordova
        run: |
          npm install -g cordova
          cordova create appmed com.fedor.meds "MedsControl"
          cd appmed
          rm -rf www/*
          cp -r ../* www/ || true
          cordova platform add android
          cordova build android --debug
          mv platforms/android/app/build/outputs/apk/debug/app-debug.apk ../MedsControl.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MedsControl v1.0.${{ github.run_number }}
          body: |
            Автоматическая сборка приложения MedsControl от Фёдора.
            Скачайте MedsControl.apk прямо на телефон.
          files: MedsControl.apk
        env:
          GITHUB_TOKEN: ${{ secrets.MY_RELEASE_TOKEN }}
