name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Setup Cordova App and Sign
      run: |
        cordova create myApp com.fedor.healthmonitor "HealthMonitor"
        cp index.html myApp/www/
        cd myApp

        # Генерация ключа в современном формате PKCS12
        keytool -genkey -v -keystore fedor.keystore -alias fedorkey -keyalg RSA -keysize 2048 -validity 10000 -storepass "FedorKey123456" -keypass "FedorKey123456" -storetype PKCS12 -dname "CN=Fedor, OU=Health, O=CheburShop, L=Uetersen, C=DE"

        # Создаем build.json с явным указанием packageType: apk
        cat <<EOF > build.json
        {
          "android": {
            "release": {
              "keystore": "fedor.keystore",
              "storePassword": "FedorKey123456",
              "alias": "fedorkey",
              "keyPassword": "FedorKey123456",
              "packageType": "apk"
            }
          }
        }
        EOF

        cordova platform add android
        cordova build android --release --buildConfig=build.json

        # Копируем готовый APK
        cp platforms/android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/fedor-health-monitor.apk"

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release APK #${{ github.run_number }}
        files: fedor-health-monitor.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
