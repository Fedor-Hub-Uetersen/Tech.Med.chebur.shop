name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Cordova
      run: npm install -g cordova

    - name: Setup and Build Cordova App
      run: |
        cordova create myApp com.fedor.healthmonitor "HealthMonitor"
        cp index.html myApp/www/
        cd myApp
        cordova platform add android@12.0.1
        cordova build android --release

    - name: Sign APK
      env:
        PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        cd myApp/platforms/android/app/build/outputs/apk/release
        keytool -genkey -v -keystore fedor.keystore -alias fedorkey -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Fedor, OU=Health, O=CheburShop, L=Uetersen, C=DE"
        jarsigner -keystore fedor.keystore -storepass "$PASS" -keypass "$PASS" app-release-unsigned.apk fedorkey
        mv app-release-unsigned.apk "$GITHUB_WORKSPACE/fedor-health-monitor.apk"

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release APK #${{ github.run_number }}
        files: fedor-health-monitor.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
