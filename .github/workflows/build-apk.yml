name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Set up Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Setup and Build Cordova App
      run: |
        cordova create myApp com.fedor.healthmonitor "HealthMonitor"
        cp index.html myApp/www/
        cd myApp
        cordova platform add android
        cordova build android --release

    - name: Generate Keystore
      run: |
        keytool -genkey -v -keystore fedor.keystore -alias fedorkey -keyalg RSA -keysize 2048 -validity 10000 -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -keypass "${{ secrets.KEYSTORE_PASSWORD }}" -dname "CN=Fedor, OU=Health, O=CheburShop, L=Uetersen, C=DE"
        mv fedor.keystore myApp/platforms/android/app/build/outputs/apk/release/

    - name: Sign Android Release APK
      uses: r3bl-org/sign-android-release@v1
      with:
        releaseDirectory: myApp/platforms/android/app/build/outputs/apk/release
        signingKeyBase64: ''
        alias: fedorkey
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "33.0.0"

    - name: Rename Signed APK
      run: |
        cd myApp/platforms/android/app/build/outputs/apk/release
        mv app-release-signed.apk fedor-health-monitor.apk || mv app-release.apk fedor-health-monitor.apk

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release APK #${{ github.run_number }}
        files: myApp/platforms/android/app/build/outputs/apk/release/fedor-health-monitor.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
